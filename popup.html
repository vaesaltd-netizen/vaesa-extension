<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VAESA Extension</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; width: 300px; padding: 12px; margin: 0; font-size: 13px; }
  h3 { margin: 0 0 8px; font-size: 14px; color: #1e40af; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e5e7eb; gap: 8px; }
  .row .k { color: #64748b; flex-shrink: 0; }
  .row .v { color: #0f172a; font-weight: 500; text-align: right; word-break: break-all; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
  button { width: 100%; padding: 8px; margin-top: 8px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #e0e7ff; }
  pre { background: #1e293b; color: #e2e8f0; padding: 8px; border-radius: 6px; font-size: 11px; max-height: 140px; overflow: auto; margin: 8px 0 0; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h3>VAESA Extension v3</h3>
<div id="status">Đang load…</div>
<button id="refresh">Refresh FB token (dtsg)</button>
<button id="clearCache">Xoá UID cache</button>
<pre id="log"></pre>
<script src="popup.js"></script>
</body>
</html>
